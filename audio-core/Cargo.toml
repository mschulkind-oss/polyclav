[package]
name = "polyclav_audio_core"
version = "0.0.1"
edition = "2021"
# Dual-licensed; see README.md § License. SPDX expression, not prose — cargo
# validates this form and crates.io requires it.
license = "Apache-2.0 OR GPL-3.0-only"

[lib]
crate-type = ["staticlib"]

# Cross-platform dependencies (build on every OS). The audio I/O backend and
# the plugin hosts are target-gated below: PipeWire + LV2/CLAP on Linux, cpal
# (CoreAudio) on macOS, cpal (WASAPI/ASIO) + CLAP on Windows.
[dependencies]
crossbeam-queue = "0.3"
# oxisynth: pure-Rust FluidSynth port. Reads SF2 and SF3 (rustysynth is SF2 only).
oxisynth = "0.1"

# sfizz (SFZ player) is an OPTIONAL backend, dlopen'd at runtime via
# libloading — the binary does NOT link it, so the build needs no sfizz and
# `.sfz` patches degrade gracefully when libsfizz is absent. Because sfizz is
# never linked, the sfizz.rs/sfizz_sys.rs modules compile on macOS too (the
# dylib is simply absent at runtime). clack-host also uses libloading.
libloading = "0.8"

# Pure-Rust DSP backbone for the native synth backend (Phase 1; see
# docs/ROADMAP.md). Provides bandlimited oscillators
# (PolyBLEP), the Huovilainen Moog ladder, ADSR primitives, and
# saturation. MIT OR Apache-2.0, clean for static linking into our
# Apache 2.0 binary.
fundsp = "0.23"

# --- Linux only: PipeWire output + LV2 plugin host ------------------------
# pipewire (pipewire-rs) links libpipewire and has no macOS or Windows port.
# livi is the LV2 host and wraps the lilv C library (pkg-config'd; no non-Linux
# build). lv2_raw is a livi companion (livi uses but doesn't re-export
# lv2_raw::LV2Urid; pinned to livi's version to avoid two copies).
[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10"
livi = "0.7"
lv2_raw = "0.2"

# --- Linux and Windows: CLAP plugin host ---------------------------------
# clack-host is pure Rust (plugin bundles are dlopen'd via libloading), so it
# hosts CLAP plugins on both platforms. macOS stays CLAP-free: LV2/CLAP hosting
# is out of scope for the v1 macOS port (macOS SynthBackend =
# Oxi/Sfizz/Native), and lib.rs keeps its non-Linux CLAP FFI stubs for it.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
clack-host = "0.1"
clap-sys = "0.5"

# --- macOS and Windows: cpal output --------------------------------------
# cpal is the platform audio abstraction on both non-Linux platforms. On macOS
# its CoreAudio backend maps BufferSize::Fixed(n) to
# kAudioDevicePropertyBufferFrameSize — this is how polyclav dictates its own
# buffer size. On Windows it is WASAPI (shared mode only), where the same knob
# is bounded by the device period, so a 128-frame request becomes ~480 frames;
# see docs/WINDOWS_PORT.md §3.1. Pulls coreaudio-rs/coreaudio-sys (system
# frameworks) on macOS and windows-rs on Windows — no Homebrew or SDK packages
# either way.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.18.1"

[features]
default = []
# Windows only: adds cpal's ASIO host (asio-sys). The ASIO SDK is downloaded at
# build time from Steinberg and needs LLVM/clang for bindgen, so this stays OFF
# by default and must never be enabled in a default release build. A binary
# built with this feature links the GPL-3.0 ASIO SDK and is therefore
# distributed under GPL-3.0 rather than Apache-2.0 — see README.md § License
# and docs/WINDOWS_PORT.md.
asio = ["cpal/asio"]
