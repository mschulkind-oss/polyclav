name: Publish to PyPI

# Builds portable, dynamically-linked Linux and macOS wheels and publishes
# both to the same PyPI release, so `uvx polyclav` / `pipx install polyclav`
# work on either platform.
#
# WHY NOT the nix flake (used by ci.yml) for the Linux wheel: a nix build
# bakes /nix/store RUNPATHs into the binary, so it only runs on a nix
# machine. The wheel must resolve its libs the normal way — by SONAME via
# the user's ldconfig (FHS locations) — so build-linux builds on a stock
# Ubuntu runner with apt-provided -dev libs and no rpath. The resulting
# binary runs on any glibc distro (Fedora/Arch/Debian/...) where the user
# has PipeWire/ALSA/lilv installed.
#
# The Linux wheel is tagged manylinux_2_39 (the runner's glibc baseline) but
# depends on the user's system audio libs — it is intentionally NOT
# auditwheel-bundled (no bundling, no static linking). sfizz is optional
# (dlopen'd at runtime, on both platforms), so it is not needed to build and
# not required to run.
#
# build-macos needs none of that: the macOS backend (cpal/CoreAudio) and v1
# macOS patch types (native/SF2/SF3/SFZ) link nothing beyond system
# frameworks — no Homebrew package required at all (see ci-macos.yml, which
# proves this compiles clean with zero `brew install` steps), so the macOS
# wheel is about as close to "just works" as a compiled binary gets.
#
# WHY NOT GORELEASER — this is a load-bearing constraint, not a gap to
# close. Two independent reasons, either of which alone is sufficient:
#
# 1. The release unit is a PyPI wheel; goreleaser cannot build or publish
#    one, so a custom workflow is required regardless of anything else.
# 2. goreleaser creates the GitHub release with GITHUB_TOKEN, and GitHub
#    deliberately raises NO workflow-triggering events for activity under
#    that token. This workflow's `on: release: published` would never fire
#    again — PyPI and the Homebrew tap would silently stop updating, with
#    no error anywhere. (mavor hit the loud variant of this trap: a race
#    for the same release, published with zero assets.) Releases here are
#    cut by hand — `gh release create` under a PAT — precisely so this
#    trigger fires. The tap formula is maintained by the
#    update-homebrew-tap job below, which does by hand what a goreleaser
#    `brews:` block would do.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v); dry-run, does not publish"
        required: false
        default: "0.0.0.dev0"

permissions:
  contents: read

jobs:
  build-linux:
    # Ubuntu 24.04: glibc 2.39 -> manylinux_2_39. 22.04 is too old — its
    # PipeWire (0.3.48) predates the spa_video_info_raw layout the pipewire-rs
    # 0.10 crate expects, so libspa fails to compile. Verified in a container.
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to attach the binary tarball to the release, on a real release
    env:
      # Stock pipewire-0.3.pc emits -fno-strict-aliasing / -fno-strict-overflow;
      # Go's cgo rejects unknown pkg-config flags unless allowlisted.
      CGO_CFLAGS_ALLOW: "-fno-strict-aliasing|-fno-strict-overflow"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system libraries (apt, FHS-standard locations)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config clang libclang-dev \
            libpipewire-0.3-dev libasound2-dev \
            liblilv-dev lv2-dev libserd-dev libsord-dev libsratom-dev
          # NOT installed on purpose:
          #  - sfizz: optional, dlopen'd at runtime; not needed to build.
          #  - libzix: Ubuntu's lilv 0.24 vendors zix, so `-tags portable`
          #    omits -lzix-0 (see internal/audio/zix_link.go).

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Rust audio-core
        run: cargo build --release --manifest-path audio-core/Cargo.toml

      - name: Build binaries (native cgo, system SONAMEs, no rpath, portable)
        run: |
          mkdir -p dist
          for cmd in polyclav polyclav-components; do
            go build -tags portable -trimpath -ldflags "-s -w" \
              -o "dist/$cmd" "./cmd/$cmd"
          done

      - name: Verify portability (no /nix/store, report dynamic deps)
        run: |
          if readelf -d dist/polyclav | grep -qi 'nix/store'; then
            echo "::error::binary has a /nix/store RUNPATH — not portable"; exit 1
          fi
          echo "dynamic dependencies:"; ldd dist/polyclav || true

      - name: Build wheel
        # --exec-wrapper: the wheel's entry points become sh launchers that
        # diagnose missing system libs (PipeWire/ALSA/lilv) instead of dying
        # with an unactionable loader error. macOS needs no wrapper — its
        # backends link nothing beyond system frameworks.
        run: |
          python3 scripts/build_wheel.py \
            --version "${{ steps.ver.outputs.version }}" \
            --platform-tag manylinux_2_39_x86_64 \
            --binary dist/polyclav --binary dist/polyclav-components \
            --readme README.md --output-dir wheelhouse --exec-wrapper

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: polyclav-wheel-linux
          path: wheelhouse/*.whl

      - name: Archive raw binaries (for the Homebrew tap, not PyPI)
        # Same shape as build-macos: a plain binary tarball, separate from
        # the wheel. These are the already-verified portable builds (no
        # /nix/store RUNPATH) — the bytes the wheel ships, unbundled.
        run: tar czf dist/polyclav-linux-x86_64.tar.gz -C dist polyclav polyclav-components

      - name: Upload binary archive as a release asset
        # Only on a real release -- workflow_dispatch dry runs have no
        # release to attach to. This is what the formula's on_linux url
        # points at.
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/polyclav-linux-x86_64.tar.gz \
            --repo "${{ github.repository }}" --clobber

      - name: Upload binary archive as a build artifact
        # For update-homebrew-tap below -- avoids re-fetching the asset it
        # just uploaded (and needing the release to be fully consistent
        # yet) when this job already has the exact bytes in hand.
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: polyclav-linux-tarball
          path: dist/polyclav-linux-x86_64.tar.gz

  build-macos:
    # Apple Silicon only for now, matching the same scope call already made
    # for the sfizz builds (build-sfizz-macos.yml) and the PyPI wheel-tag
    # convention: an arm64-tagged wheel is simply not installable on Intel
    # Macs (pip/uv checks the tag), so this is a real platform-coverage gap,
    # not just a missed optimization — a macosx_x86_64 job is a plausible
    # fast-follow, not attempted here to keep this first pass small.
    runs-on: macos-15
    permissions:
      contents: write # to attach the binary tarball to the release, on a real release
    env:
      CGO_ENABLED: "1"
      GOFLAGS: "-mod=mod"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable

      # Deliberately no `brew install` step — see the workflow-level comment
      # for why the macOS backend needs nothing beyond system frameworks.

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Rust audio-core
        run: cargo build --release --manifest-path audio-core/Cargo.toml

      - name: Build binaries (native cgo, system frameworks only)
        run: |
          mkdir -p dist
          for cmd in polyclav polyclav-components; do
            go build -tags portable -trimpath -ldflags "-s -w" \
              -o "dist/$cmd" "./cmd/$cmd"
          done

      - name: Verify portability (no Homebrew/nix paths, report dynamic deps)
        run: |
          set -euo pipefail
          if otool -L dist/polyclav | grep -Eqi '/opt/homebrew|/usr/local/(Cellar|opt)|/nix/store'; then
            echo "::error::binary links a Homebrew/nix path — not portable, a plain PyPI/Homebrew install won't have it"
            otool -L dist/polyclav
            exit 1
          fi
          echo "dynamic dependencies:"; otool -L dist/polyclav

      - name: Build wheel
        run: |
          python3 scripts/build_wheel.py \
            --version "${{ steps.ver.outputs.version }}" \
            --platform-tag macosx_11_0_arm64 \
            --binary dist/polyclav --binary dist/polyclav-components \
            --readme README.md --output-dir wheelhouse

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: polyclav-wheel-macos
          path: wheelhouse/*.whl

      - name: Archive raw binaries (for the Homebrew tap, not PyPI)
        # A Homebrew formula wants a plain binary tarball, not a wheel --
        # this is a separate artifact from the wheel above for that reason,
        # not a duplication of it.
        run: tar czf dist/polyclav-macos-arm64.tar.gz -C dist polyclav polyclav-components

      - name: Upload binary archive as a release asset
        # Only on a real release -- workflow_dispatch dry runs have no
        # release to attach to. This is what the Homebrew formula's `url`
        # points at.
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/polyclav-macos-arm64.tar.gz \
            --repo "${{ github.repository }}" --clobber

      - name: Upload binary archive as a build artifact
        # For update-homebrew-tap below -- avoids re-fetching the asset it
        # just uploaded (and needing the release to be fully consistent
        # yet) when this job already has the exact bytes in hand.
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: polyclav-macos-tarball
          path: dist/polyclav-macos-arm64.tar.gz

  update-homebrew-tap:
    # mschulkind-oss/homebrew-tap is one shared tap for the whole
    # portfolio (no per-project taps). HOMEBREW_TAP_TOKEN is an org-level
    # secret with PUSH access to it -- this job commits the updated
    # Formula/polyclav.rb straight to the tap's main branch, doing by hand
    # what a goreleaser `brews:` block would do (see the WHY NOT GORELEASER
    # note in the header for why goreleaser itself must not be introduced).
    # No PR, no manual merge step -- the whole point of having a
    # push-capable token already wired up is that this doesn't need a human
    # in the loop for a plain version+sha256 bump.
    needs: [build-linux, build-macos]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download binary archives
        # both release tarballs: polyclav-macos-tarball/, polyclav-linux-tarball/
        uses: actions/download-artifact@v4
        with:
          pattern: polyclav-*-tarball
          path: dist

      - name: Compute release info
        id: info
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "macos_sha256=$(sha256sum dist/polyclav-macos-tarball/polyclav-macos-arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_sha256=$(sha256sum dist/polyclav-linux-tarball/polyclav-linux-x86_64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "macos_url=https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/polyclav-macos-arm64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "linux_url=https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/polyclav-linux-x86_64.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: mschulkind-oss/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write Formula/polyclav.rb
        # Both platforms the release actually produces: macOS Apple Silicon
        # (build-macos) and x86_64 Linux (build-linux, the same portable
        # bytes the wheel ships). Intel macOS still odie's -- no artifact
        # exists for it, and a block pointing at a binary that doesn't
        # exist would be worse than none.
        run: |
          cat > tap/Formula/polyclav.rb <<EOF
          # frozen_string_literal: true

          # Maintained by polyclav's .github/workflows/publish.yml -- not
          # hand-edited, and not GoReleaser-generated (polyclav doesn't use
          # goreleaser; see the workflow header for why it must stay that
          # way). Regenerated on every release.
          class Polyclav < Formula
            desc "Live-piano host: MIDI keyboard -> soundfont/plugin synthesis -> system audio"
            homepage "https://github.com/${{ github.repository }}"
            version "${{ steps.info.outputs.version }}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "${{ steps.info.outputs.macos_url }}"
                sha256 "${{ steps.info.outputs.macos_sha256 }}"

                def install
                  bin.install "polyclav"
                  bin.install "polyclav-components"
                end
              else
                odie "polyclav's Homebrew formula only supports Apple Silicon (arm64) for now."
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "${{ steps.info.outputs.linux_url }}"
                sha256 "${{ steps.info.outputs.linux_sha256 }}"

                def install
                  bin.install "polyclav"
                  bin.install "polyclav-components"
                end
              else
                odie "polyclav's Homebrew formula only provides x86_64 Linux binaries for now."
              end
            end

            def caveats
              if OS.mac?
                <<~EOS
                  First run needs soundfonts (and SFZ support): run
                    polyclav bootstrap
                  before starting polyclav for the first time.
                EOS
              else
                <<~EOS
                  polyclav plays audio through your Linux distro's libraries,
                  which Homebrew does not provide. Without them the binary will
                  not start. Install:
                    Debian/Ubuntu: sudo apt install pipewire libasound2 liblilv-0-0
                    Fedora:        sudo dnf install pipewire alsa-lib lilv
                    Arch:          sudo pacman -S pipewire alsa-lib lilv
                  The binary also needs glibc >= 2.39 -- on older Debian/Ubuntu
                  releases, build from source instead.
                  First run also needs soundfonts: run \`polyclav bootstrap\`.
                EOS
              end
            end

            test do
              system "#{bin}/polyclav", "--version"
            end
          end
          EOF

      - name: Commit and push the formula update
        # actions/checkout already configured push credentials from
        # HOMEBREW_TAP_TOKEN for this working directory -- no separate
        # GH_TOKEN/gh CLI call needed for a plain commit+push.
        working-directory: tap
        run: |
          set -euo pipefail
          VERSION="${{ steps.info.outputs.version }}"
          git config user.name "polyclav-release-bot"
          git config user.email "actions@github.com"
          git add Formula/polyclav.rb
          if git diff --cached --quiet; then
            echo "Formula/polyclav.rb already up to date for $VERSION -- nothing to push"
          else
            git commit -m "polyclav $VERSION"
            git push origin main
          fi

  publish:
    # Only publish on a real release. Uses PyPI Trusted Publishing (OIDC) — no
    # API token. The PyPI publisher for `polyclav` is scoped to the `pypi`
    # GitHub environment, so this job must declare it — the OIDC claim must
    # match (repo mschulkind-oss/polyclav, workflow publish.yml, environment pypi).
    needs: [build-linux, build-macos]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: polyclav-wheel-linux
          path: wheelhouse
      - uses: actions/download-artifact@v4
        with:
          name: polyclav-wheel-macos
          path: wheelhouse
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
